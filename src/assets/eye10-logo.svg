<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 180" role="img" aria-labelledby="title desc">
  <title id="title">EYE10 Logo</title>
  <desc id="desc">Stylized glasses icon above EYE10 text in premium gold tones.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5ecd8" />
      <stop offset="1" stop-color="#dfcfac" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8a553" />
      <stop offset="1" stop-color="#9d7425" />
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#6f5320" flood-opacity="0.25" />
    </filter>
  </defs>

  <rect width="360" height="180" rx="16" fill="url(#bg)" />

  <g transform="translate(105 35)" fill="none" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M34 23 h40" />
    <circle cx="18" cy="23" r="14" />
    <circle cx="56" cy="23" r="14" />
    <path d="M-4 18 l-10 -8" />
    <path d="M78 18 l10 -8" />
  </g>

  <text x="180" y="112" text-anchor="middle" font-size="58" font-weight="800" font-family="Georgia, 'Times New Roman', serif" fill="url(#gold)" filter="url(#soft)">EYE10</text>
  <rect x="70" y="126" width="220" height="6" rx="3" fill="url(#gold)" opacity="0.9" />
</svg>
